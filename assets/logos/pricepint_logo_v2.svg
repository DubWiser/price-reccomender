<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg"><defs><mask id="imagine-text-gaps-20db91" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="320" fill="white"/><rect x="269.765625" y="144.3125" width="140.46875" height="56.515625" fill="black" rx="2"/><rect x="286" y="188.3125" width="108" height="56.515625" fill="black" rx="2"/><rect x="238.359375" y="244.0625" width="203.28125" height="16.515625" fill="black" rx="2"/></mask></defs>
  <!-- Background pill -->
